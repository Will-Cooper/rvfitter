[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rvfitter"
dynamic = ["version"]
description = "Radial velocities of brown dwarfs from reduced 1D spectra"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE"]
keywords = ["astronomy", "brown dwarfs", "radial velocity", "spectroscopy", "ultracool dwarfs"]
authors = [{ name = "Will Cooper", email = "w.cooper@herts.ac.uk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "specutils>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
mcmc = ["emcee>=3.1", "corner>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "build", "twine"]
gui-test = ["rvfitter[gui]", "pytest-qt>=4.4"]
all = ["rvfitter[gui,mcmc]"]

[project.urls]
Homepage = "https://github.com/Will-Cooper/rvfitter"
Documentation = "https://github.com/Will-Cooper/rvfitter/tree/main/docs"
Changelog = "https://github.com/Will-Cooper/rvfitter/releases"
Repository = "https://github.com/Will-Cooper/rvfitter"
Issues = "https://github.com/Will-Cooper/rvfitter/issues"

[project.scripts]
rvfitter = "rvfitter.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "3.0.0.dev0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # PyPI rejects +g<hash> local versions

[tool.hatch.build.targets.wheel]
packages = ["src/rvfitter"]
exclude = ["src/rvfitter/data/telluric_hitran.npz"]

[tool.hatch.build.targets.sdist]
exclude = ["legacy", "src/rvfitter/data/telluric_hitran.npz"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/legacy"
markers = [
    "data: needs local test data (not available in CI)",
    "gui: needs PySide6 and a (possibly offscreen) Qt platform",
    "slow: long-running injection-recovery or MCMC tests (excluded from default CI)",
    "network: needs internet access (e.g. the SVO theory server); skipped when offline",
]
