[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvfitter"
version = "2.0.0.dev0"
description = "Radial velocities of brown dwarfs from reduced 1D spectra"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE" }
authors = [{ name = "W. J. Cooper" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "specutils>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
mcmc = ["emcee>=3.1", "corner>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]
gui-test = ["rvfitter[gui]", "pytest-qt>=4.4"]
all = ["rvfitter[gui,mcmc]"]

[project.urls]
Homepage = "https://github.com/Will-Cooper/rvfitter"
Repository = "https://github.com/Will-Cooper/rvfitter"
Issues = "https://github.com/Will-Cooper/rvfitter/issues"

[project.scripts]
rvfitter = "rvfitter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rvfitter"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/legacy"
markers = [
    "data: needs local test data (not available in CI)",
    "gui: needs PySide6 and a (possibly offscreen) Qt platform",
    "slow: long-running injection-recovery or MCMC tests (excluded from default CI)",
]
